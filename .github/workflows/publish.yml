name: publish

on:
  push:
    branches: [stable]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: blacklanternsecurity/CLA/.github/workflows/release-check.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11

  rust:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-tests.yml

  python:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wheels:
    needs: [rust, python]
    permissions:
      contents: read
    uses: blacklanternsecurity/CLA/.github/workflows/maturin-wheels.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      manylinux: auto

  pypi:
    needs: wheels
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.wheels.outputs.artifacts }}
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  crates:
    needs: [check, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: blacklanternsecurity/CLA/.github/workflows/crates.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    needs: [check, wheels, crates, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/CLA/.github/workflows/publish.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      artifacts: ${{ needs.wheels.outputs.artifacts }}
      assets: dist/*
