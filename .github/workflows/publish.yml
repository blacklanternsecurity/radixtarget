name: publish

on:
  push:
    branches: [stable]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/release-check.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}

  rust:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-tests.yml # zizmor: ignore[self-repository]

  python:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-tests.yml # zizmor: ignore[self-repository]
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wheels:
    needs: [rust, python]
    permissions:
      contents: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/maturin-wheels.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      manylinux: auto

  pypi:
    needs: wheels
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.wheels.outputs.artifacts }}
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  crates:
    needs: [check, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: blacklanternsecurity/release-workflows/.github/workflows/crates.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    needs: [check, wheels, crates, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/publish.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      artifacts: ${{ needs.wheels.outputs.artifacts }}
      assets: dist/*
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}
