name: Rust tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: blacklanternsecurity/release-workflows/.github/workflows/rust-tests.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      cargo-args: --all-features --locked
