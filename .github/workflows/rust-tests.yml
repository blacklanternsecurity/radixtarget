name: Rust tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: blacklanternsecurity/release-workflows/.github/workflows/rust-tests.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    with:
      cargo-args: --all-features --locked
