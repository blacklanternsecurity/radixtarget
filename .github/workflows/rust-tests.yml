name: Rust tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: blacklanternsecurity/CLA/.github/workflows/rust-tests.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      cargo-args: --all-features --locked
