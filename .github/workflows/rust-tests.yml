name: Rust tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: blacklanternsecurity/release-workflows/.github/workflows/rust-tests.yml@3fe35ff9c43f61c98bd8c93182686b6be97d2759 # v1.3.0
    with:
      cargo-args: --all-features --locked
