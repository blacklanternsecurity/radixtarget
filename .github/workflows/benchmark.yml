name: Benchmark

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR
        uses: actions/checkout@v6
        with:
          path: head

      - name: Check out target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Build the PR's harness against both sides so the measurements are
      # identical, even when the PR changes the harness itself
      - name: Use the PR's benchmark harness for the target branch
        run: |
          rm -rf base/benchmark
          cp -r head/benchmark base/benchmark

      - name: Benchmark target branch
        # e.g. fails if the PR changes the public API the harness uses
        continue-on-error: true
        working-directory: base/benchmark
        run: |
          cargo build --release --bin benchmark
          ./target/release/benchmark run --output "$GITHUB_WORKSPACE/base.json"

      - name: Benchmark PR
        working-directory: head/benchmark
        run: |
          cargo build --release --bin benchmark
          ./target/release/benchmark run --output "$GITHUB_WORKSPACE/head.json"

      - name: Compare
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE_ARGS=()
          if [ -f base.json ]; then BASE_ARGS=(--base base.json); fi
          head/benchmark/target/release/benchmark compare "${BASE_ARGS[@]}" --head head.json \
            --base-label "$BASE_REF" --head-label "$HEAD_REF" > benchmark_report.md
          cat benchmark_report.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: |
            benchmark_report.md
            base.json
            head.json
          retention-days: 30

      - name: Comment benchmark results on PR
        # fork and dependabot PRs get a read-only token and cannot comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            
            try {
              const report = fs.readFileSync('benchmark_report.md', 'utf8');
              
              // Find existing benchmark comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              
              console.log(`Found ${comments.data.length} comments on this PR`);
              
              const existingComments = comments.data.filter(comment => 
                comment.body.includes('RadixTarget Benchmark Results') &&
                comment.user.login === 'github-actions[bot]'
              );
              
              console.log(`Found ${existingComments.length} existing benchmark comments`);
              
              if (existingComments.length > 0) {
                // Update most recent comment
                const sortedComments = existingComments.sort((a, b) => 
                  new Date(b.created_at) - new Date(a.created_at)
                );
                
                const mostRecentComment = sortedComments[0];
                console.log(`Updating benchmark comment: ${mostRecentComment.id}`);
                
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: mostRecentComment.id,
                  body: report
                });
                
                // Delete older duplicates
                for (let i = 1; i < sortedComments.length; i++) {
                  try {
                    await github.rest.issues.deleteComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: sortedComments[i].id
                    });
                    console.log(`Deleted duplicate comment: ${sortedComments[i].id}`);
                  } catch (error) {
                    console.error(`Failed to delete comment: ${error.message}`);
                  }
                }
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report
                });
                console.log('Created new benchmark comment');
              }
            } catch (error) {
              console.error('Failed to post benchmark results:', error);
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## RadixTarget Benchmark Results',
                  '',
                  '> ⚠️ **Failed to generate benchmark results**',
                  '> ',
                  `> Please check the [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
                ].join('\n')
              });
            }
